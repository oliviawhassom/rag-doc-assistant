[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-doc-assistant"
version = "0.1.0"
description = "Assistant RAG pour documentation technique : réponses sourcées, abstention, évaluation reproductible."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Les versions exactes sont figées dans requirements.txt (ENF07).
dependencies = ["pypdf", "cryptography", "pydantic", "PyYAML"]

[project.scripts]
rag = "rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/rag --cov-report=term-missing"

[tool.ruff]
line-length = 100
extend-exclude = ["data"]  # corpus téléchargé : pas notre code
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caractères typographiques français (« », ’) voulus

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

